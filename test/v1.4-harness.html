      document.body.prepend(output);
    });

  <script>
    (() => {
      window.__changeLog = [];
      for (const eventName of ['input', 'change']) {
        document.addEventListener(eventName, event => {
          const holder = event.target.closest && event.target.closest('[data-test]');
          window.__changeLog.push({ event: eventName, field: holder && holder.dataset.test || '', value: event.target.value || event.target.textContent || '' });
        }, true);
      }
      const removeLayer = () => document.querySelectorAll('.common-unmodeled-layer').forEach(el => el.remove());
      document.querySelectorAll('.phoenix-radio-group__radioItem').forEach(item => item.addEventListener('click', () => {
        item.parentElement.querySelectorAll('.phoenix-radio').forEach(x => x.classList.remove('phoenix-radio--checked'));
        item.querySelector('.phoenix-radio').classList.add('phoenix-radio--checked');
      }));
      document.querySelectorAll('.phoenix-select').forEach(select => select.addEventListener('click', () => {
        removeLayer();
        const layer = document.createElement('div');
        layer.className = 'common-unmodeled-layer';
        if (select.dataset.date) {
          document.body.dataset.calendarOpened = 'yes';
          const input = document.createElement('input');
          input.className = 'phoenix-calendar-input';
          input.addEventListener('keyup', event => {
            document.body.dataset.calendarKey = event.key || 'missing';
            if (event.key !== 'Enter') return;
            select.innerHTML = '<div class="phoenix-select__singleValue"></div>';
            select.firstElementChild.textContent = input.value;
            removeLayer();
          });
          layer.appendChild(input);
        } else if (select.dataset.month) {
          const calendar = document.createElement('div');
          calendar.className = 'phoenix-calendar-month-calendar';
          let year = 2026;
          const yearText = document.createElement('span');
          yearText.className = 'phoenix-calendar-month-panel-year-select-content';
          const renderYear = () => { yearText.textContent = String(year); };
          const prev = document.createElement('button');
          prev.className = 'phoenix-calendar-month-panel-prev-year-btn';
          prev.addEventListener('click', event => { event.stopPropagation(); year--; renderYear(); });
          const next = document.createElement('button');
          next.className = 'phoenix-calendar-month-panel-next-year-btn';
          next.addEventListener('click', event => { event.stopPropagation(); year++; renderYear(); });
          calendar.append(prev, yearText, next);
          for (let month = 1; month <= 12; month++) {
            const cell = document.createElement('div');
            cell.className = 'phoenix-calendar-month-panel-cell';
            cell.textContent = month + '月';
            cell.addEventListener('click', event => {
              event.stopPropagation();
              select.innerHTML = '<div class="phoenix-select__singleValue"></div>';
              select.firstElementChild.textContent = year + '-' + String(month).padStart(2, '0');
              removeLayer();
            });
            calendar.appendChild(cell);
          }
          renderYear();
          layer.appendChild(calendar);
        } else if (select.dataset.searchOptions) {
          const render = value => {
            layer.innerHTML = '';
            for (const text of select.dataset.searchOptions.split('|').filter(text => !value || text.includes(value))) {
              const option = document.createElement('div');
              option.className = 'phoenix-selectList__listItem';
              option.textContent = text;
              option.addEventListener('click', event => {
                event.stopPropagation();
                select.innerHTML = '<div class="phoenix-select__singleValue"></div>';
                select.firstElementChild.textContent = text;
                removeLayer();
              });
              layer.appendChild(option);
            }
          };
          const search = select.querySelector('input');
          search.addEventListener('input', event => render(event.target.value), { once: true });
        } else {
          for (const text of select.dataset.options.split('|')) {
            const option = document.createElement('div');
            option.className = 'phoenix-selectList__listItem';
            option.textContent = text;
            option.addEventListener('click', event => {
              event.stopPropagation();
              select.innerHTML = '<div class="phoenix-select__singleValue"></div>';
              select.firstElementChild.textContent = text;
              removeLayer();
            });
            layer.appendChild(option);
          }
        }
        document.body.appendChild(layer);
      }));

      document.querySelector('[data-test="education-school"] input').addEventListener('input', event => {
        removeLayer();
        if (!event.target.value) return;
        const layer = document.createElement('div');
        layer.className = 'common-unmodeled-layer';
        const option = document.createElement('div');
        option.className = 'phoenix-selectList__listItem';
        option.textContent = '测试大学';
        option.addEventListener('click', () => { event.target.value = option.textContent; removeLayer(); });
        layer.appendChild(option);
        document.body.appendChild(layer);
      });

      window.chrome = {
        storage: {
          local: {
            get: async () => ({ profile: {
              name:'测试用户', gender:'女', politicalStatus:'共青团员', birthDate:'2001-02-03',
              school:'测试大学', recommendationCode:'ABC123', intro:'熟悉嵌入式开发', recruitmentSource:'学校就业网',
              householdType:'非农业户口', graduationDate:'2026-06',
              projectName:'复杂表单适配', projectStartDate:'2024-03', projectEndDate:'2024-08', projectDescription:'实现多框架表单识别与安全填充',
              internshipCompany:'测试科技', internshipRole:'开发实习生', internshipStartDate:'2024-07', internshipEndDate:'2024-09', internshipContent:'负责自动化测试与组件适配',
              educationDiscipline:'工学', unifiedRecruitment:'是', overseasEducation:'否', languageType:'英语', languageProficiency:'熟练',
              awardName:'国家奖学金', awardDate:'2025-06', awardLevel:'国家级', awardDescription:'学习成绩与科研表现突出',
              researchName:'智能填充方法', researchDate:'2025-08', researchLevel:'发明专利', researchDescription:'面向复杂招聘表单的字段识别方法',
              willingAllocation:'是', acceptRelocation:'否', acceptUnderdevelopedOverseas:'否', hasRelativesAtCompany:'否',
              customs:[{label:'请输入',value:'污染值'},{label:'Verification Code',value:'123456'},{label:'Credit Card Number',value:'4111111111111111'}]
            }, settings:{}, learned:{'请输入':{label:'请输入',value:'历史污染值'}}, siteRules:{} }),
            set: async () => undefined
          },
          onChanged: { addListener: () => undefined }
        },
        runtime: {
          onMessage: { addListener: fn => { window.__fillListener = fn; } },
          sendMessage: async message => {
            if (message.type !== 'AI_MATCH_FIELDS') return { ok:false };
            document.body.dataset.aiHasGeneric = String(message.payload.fields.some(item => item.label === '请输入'));
            const target = message.payload.controls.find(item => item.label.includes('母校全称'));
            return { ok:true, mappings: target ? [{ controlId:target.id, fieldKey:'school', confidence:0.98 }] : [] };
          }
        }
      };
    })();
  </script>
  <script src="../content/content.js?v=11001"></script>
  <script>

      let submitClicks = 0;
      document.getElementById('submitButton').addEventListener('click', event => { event.preventDefault(); submitClicks++; });
      window.__fillListener({ type:'FILL_FORM', overwrite:false, useAI:true }, null, result => {

          internshipEnd: document.querySelector('[data-test="internship-end"] .phoenix-select__singleValue')?.textContent || '',
          internshipContent: document.querySelector('[data-test="internship-content"] textarea').value,

          unifiedRecruitment: document.querySelector('[data-test="unified-recruitment"] .phoenix-radio--checked')?.textContent || '',

          awardLevel: document.querySelector('[data-test="award-level"] .phoenix-select__singleValue')?.textContent || '',
          awardDescription: document.querySelector('[data-test="award-description"] textarea').value,
          researchName: document.querySelector('[data-test="research-name"] input').value,
          researchDate: document.querySelector('[data-test="research-date"] .phoenix-select__singleValue')?.textContent || '',
          researchLevel: document.querySelector('[data-test="research-level"] input').value,
          researchDescription: document.querySelector('[data-test="research-description"] textarea').value,
          willingAllocation: document.querySelector('[data-test="willing-allocation"] .phoenix-radio--checked')?.textContent || '',
          acceptRelocation: document.querySelector('[data-test="accept-relocation"] .phoenix-radio--checked')?.textContent || '',
          acceptUnderdeveloped: document.querySelector('[data-test="accept-underdeveloped"] .phoenix-radio--checked')?.textContent || '',
          hasRelatives: document.querySelector('[data-test="has-relatives"] .phoenix-radio--checked')?.textContent || '',

          aiHasGeneric: document.body.dataset.aiHasGeneric,
          verification: document.querySelector('[data-test="verification"] input').value,
          card: document.querySelector('[data-test="card"] input').value,
          submitClicks
        };
